[project]
name = "Lighthouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiogram>=3.29.0",
  "aiohttp>=3.14.1",
  "apscheduler>=3.11.3",
  "asyncio>=4.0.0",
  "asyncpg>=0.31.0",
  "cachetools>=7.1.7",
  "dotenv>=0.9.9",
  "fastapi>=0.138.2",
  "loguru>=0.7.3",
  "openai>=2.45.0",
  "psycopg[binary,pool]>=3.3.4",
  "sqlalchemy>=2.0.51",
  "telethon>=1.44.0",
  "tenacity>=9.1.4",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
enviroments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
